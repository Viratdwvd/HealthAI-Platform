groups:
  # ── API Gateway ────────────────────────────────────────────────────────────
  - name: api_gateway
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{service="api-gateway",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{service="api-gateway"}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway error rate > 5%"
          description: "Current error rate: {{ $value | humanizePercentage }}"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{service="api-gateway"}[5m]))
            by (le)
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API Gateway p99 latency > 3s"

      - alert: RateLimitHits
        expr: |
          sum(rate(http_requests_total{service="api-gateway",status="429"}[1m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High rate-limit hit rate (> 10/min)"

  # ── Ingestion Service ──────────────────────────────────────────────────────
  - name: ingestion
    rules:
      - alert: IngestionJobFailureRate
        expr: |
          sum(rate(ingestion_jobs_total{status="failed"}[10m]))
          /
          sum(rate(ingestion_jobs_total[10m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion job failure rate > 10%"

  # ── RAG Service ────────────────────────────────────────────────────────────
  - name: rag
    rules:
      - alert: EmbeddingLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{service="rag-service",handler="/embed"}[5m]))
            by (le)
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG embedding p95 latency > 5s"

  # ── LLM Service ────────────────────────────────────────────────────────────
  - name: llm
    rules:
      - alert: LLMServiceDown
        expr: up{job="llm-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LLM Service is down"
          description: "LLM Service has been unreachable for > 1 minute"

      - alert: LLMHighLatency
        expr: |
          histogram_quantile(0.90,
            sum(rate(http_request_duration_seconds_bucket{service="llm-service"}[5m]))
            by (le)
          ) > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM Service p90 latency > 15s"

  # ── All services ───────────────────────────────────────────────────────────
  - name: platform_health
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|ingestion-service|rag-service|analytics-service|knowledge-service|agent-orchestrator|llm-service|session-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"

      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag_sum > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag > 1000 messages"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"

      - alert: QdrantDiskHigh
        expr: qdrant_disk_usage_bytes / qdrant_disk_total_bytes > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant disk usage > 80%"
