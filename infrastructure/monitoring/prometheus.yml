global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api-gateway
    static_configs:
      - targets: [api-gateway:8000]
    metrics_path: /metrics

  - job_name: ingestion-service
    static_configs:
      - targets: [ingestion-service:8001]
    metrics_path: /metrics

  - job_name: rag-service
    static_configs:
      - targets: [rag-service:8002]
    metrics_path: /metrics

  - job_name: analytics-service
    static_configs:
      - targets: [analytics-service:8003]
    metrics_path: /metrics

  - job_name: knowledge-service
    static_configs:
      - targets: [knowledge-service:8004]
    metrics_path: /metrics

  - job_name: agent-orchestrator
    static_configs:
      - targets: [agent-orchestrator:8005]
    metrics_path: /metrics

  - job_name: llm-service
    static_configs:
      - targets: [llm-service:8006]
    metrics_path: /metrics

  - job_name: session-service
    static_configs:
      - targets: [session-service:8007]
    metrics_path: /metrics
