# ── Ingestion Service ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: healthcare
  labels: { app: ingestion-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestion-service }
  template:
    metadata:
      labels: { app: ingestion-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: ingestion-service
          image: healthcare/ingestion-service:latest
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef:    { name: platform-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi   }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: healthcare
spec:
  selector: { app: ingestion-service }
  ports: [{ port: 8001, targetPort: 8001 }]

