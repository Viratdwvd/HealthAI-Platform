name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/healthcare

jobs:
  # ── Lint & Type-check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: pip install ruff mypy pydantic pydantic-settings types-PyYAML

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (shared)
        run: mypy shared/ --ignore-missing-imports

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [ingestion-service, analytics-service, knowledge-service, agent-orchestrator]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (${{ matrix.service }})
        run: |
          pip install \
            pytest pytest-asyncio pytest-cov \
            pydantic pydantic-settings \
            pandas statsmodels pyyaml \
            fastapi httpx

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/shared:${{ github.workspace }}/services/${{ matrix.service }}
        run: |
          pytest services/${{ matrix.service }}/tests/ \
            -v --tb=short \
            --cov=services/${{ matrix.service }} \
            --cov-report=xml:coverage-${{ matrix.service }}.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-${{ matrix.service }}.xml
          flags: ${{ matrix.service }}

  # ── Frontend build ───────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ── Docker build & push ──────────────────────────────────────────────────────
  docker:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api-gateway
            dockerfile: api-gateway/Dockerfile
          - name: ingestion-service
            dockerfile: services/ingestion-service/Dockerfile
          - name: rag-service
            dockerfile: services/rag-service/Dockerfile
          - name: analytics-service
            dockerfile: services/analytics-service/Dockerfile
          - name: knowledge-service
            dockerfile: services/knowledge-service/Dockerfile
          - name: agent-orchestrator
            dockerfile: services/agent-orchestrator/Dockerfile
          - name: llm-service
            dockerfile: services/llm-service/Dockerfile
          - name: session-service
            dockerfile: services/session-service/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to K8s (staging) ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Apply namespace & config
        run: kubectl apply -f infrastructure/k8s/configmaps/

      - name: Deploy all services
        run: |
          kubectl apply -f infrastructure/k8s/deployments/
          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }} \
            -n healthcare
          # (repeat for each service – or use Helm in production)

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway       -n healthcare --timeout=120s
          kubectl rollout status deployment/agent-orchestrator -n healthcare --timeout=120s

      - name: Smoke test
        run: |
          sleep 10
          curl -f https://staging.healthai.example.com/health || exit 1
